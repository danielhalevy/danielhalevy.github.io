<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Hourglass King</title>
<meta name="description" content="The Hourglass King: a free action-platformer for Android phones.">
<link rel="icon" href="icon.png">
<style>
:root{--bg:#f6f1e7;--fg:#2a2118;--muted:#6b5d4d;--accent:#b8862b}
@media (prefers-color-scheme:dark){:root{--bg:#17130f;--fg:#f1e8d8;--muted:#b5a68f;--accent:#e0b24f}}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.6 system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:48px 16px;text-align:center}
img{width:128px;height:128px;border-radius:24px}
h1{margin:16px 0 8px;font-size:32px}
p{color:var(--muted)}
a.btn{display:inline-block;margin:16px 0;padding:14px 28px;border-radius:12px;background:var(--accent);color:#1a140c;font-weight:700;text-decoration:none}
footer{margin-top:40px;font-size:16px}
footer a{color:var(--fg)}
</style>
</head>
<body>
<main>
<img src="icon.png" alt="The Hourglass King icon">
<h1>The Hourglass King</h1>
<p>A free action-platformer for Android phones. Parry, dodge and bend time. Made by one developer in Israel.</p>
<a class="btn" href="https://play.google.com/store/apps/details?id=com.hourglass.king">Get it on Google Play</a>
<footer>
<p><a href="privacy.html">Privacy policy</a> · <a href="mailto:hourglasskingsupport@gmail.com">hourglasskingsupport@gmail.com</a></p>
</footer>
</main>
</body>
</html>
